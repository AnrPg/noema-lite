# Netlify: builds the public website from this repo on every push.
# The published folder (dist/site) contains ONLY the app + shared subject packs:
# no PDFs, no private packs, no account backups, no database, no config.local.js.
[build]
  # then the Python runtime of py-module@1 activities (docs/INTERACTIVE_PYTHON.md §Deployment): Pyodide 0.27.7, numpy, scipy and the allow-listed
  # wheels, each checked against its pinned sha256, into dist/site/vendor/. The download is kept in Netlify's build cache when it has one
  # ($NETLIFY_CACHE_DIR), else fetched again (~37 MB from cdn.jsdelivr.net). It never breaks the deploy: if it fails, the log says why and
  # Python activities show their fallback (the app finds no manifest) until the next deploy. `timeout 600` bounds a stalled download
  # (urllib's timeout is per read) so it can never run the build past Netlify's build time limit; the manifest is written last, so a
  # run cut short leaves no manifest and the app shows the fallback. Only the pinned files are shipped: 10 files of
  # tools/pyodide_manifest.json + the allow-listed wheels, ~37 MB, the largest 13.5 MB (scipy).
  command = "python3 tools/build.py site --no-validate && (timeout 600 python3 tools/fetch_pyodide.py --cache \"${NETLIFY_CACHE_DIR:-$HOME/.cache}/noema-pyodide\" || echo '⚠ py-module@1: Pyodide could not be fetched (see the lines above); Python activities show their fallback on this deploy')"
  publish = "dist/site"
[functions]
  # the Claude connector (MCP server), bundled by tools/build.py (tools/connector_bundle.mjs) from src/composition/connector.ts
  directory = "dist/functions"
[build.environment]
  PYTHON_VERSION = "3.11"
  NODE_VERSION = "22"   # tools/i18n/build.js (the UI catalogs) and tools/lang_stamp.js run in the build
