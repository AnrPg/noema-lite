<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs><rect width="800" height="420" fill="#ffffff"/><text x="400.0" y="30.0" font-size="20" font-weight="700" text-anchor="middle" fill="#1f2330" dominant-baseline="central">A thermal power station</text><rect x="30" y="90" width="130" height="70" rx="10" fill="#fff0e1" stroke="#f08c00" stroke-width="2"/><text x="95.0" y="117.8" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2330" dominant-baseline="central">Fuel</text><text x="95.0" y="137.0" font-size="12" font-weight="500" text-anchor="middle" fill="#5b6172" dominant-baseline="central">chemical energy</text><rect x="220" y="90" width="140" height="70" rx="10" fill="#fde8e8" stroke="#e5484d" stroke-width="2"/><text x="290.0" y="117.8" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2330" dominant-baseline="central">Boiler</text><text x="290.0" y="137.0" font-size="12" font-weight="500" text-anchor="middle" fill="#5b6172" dominant-baseline="central">heat → steam</text><rect x="420" y="90" width="140" height="70" rx="10" fill="#e1effe" stroke="#3b82f6" stroke-width="2"/><text x="490.0" y="117.8" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2330" dominant-baseline="central">Turbine</text><text x="490.0" y="137.0" font-size="12" font-weight="500" text-anchor="middle" fill="#5b6172" dominant-baseline="central">steam → rotation</text><rect x="620" y="90" width="150" height="70" rx="10" fill="#efebff" stroke="#7c5cff" stroke-width="2"/><text x="695.0" y="117.8" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2330" dominant-baseline="central">Generator</text><text x="695.0" y="137.0" font-size="12" font-weight="500" text-anchor="middle" fill="#5b6172" dominant-baseline="central">rotation → electricity</text><path d="M164.0,125.0 L214.4,125.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><path d="M364.0,125.0 L414.4,125.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><path d="M564.0,125.0 L614.4,125.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><circle cx="140" cy="300" r="55" fill="#fff6d6" stroke="#e0a800" stroke-width="2"/><text x="140.0" y="300.0" font-size="18" font-weight="700" text-anchor="middle" fill="#1f2330" dominant-baseline="central">Sun</text><polygon points="560,250 760,250 720,380 600,380" fill="#ddf6f3" stroke="#12a5a0" stroke-width="2"/><text x="660.0" y="315.0" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2330" dominant-baseline="central">Cooling tower</text><rect x="300" y="270" width="160" height="70" rx="10" fill="#e3f7ea" stroke="#2f9e44" stroke-width="2"/><text x="380.0" y="297.8" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2330" dominant-baseline="central">Grid</text><text x="380.0" y="317.0" font-size="12" font-weight="500" text-anchor="middle" fill="#5b6172" dominant-baseline="central">to the homes</text><path d="M630.3,162.0 L446.4,267.1" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/></svg>