# Checks the TypeScript (types, lint, format, unit tests, the bundles and their size budgets), proves the tools work on Windows,
# macOS and Linux, and runs the browser tests on Linux — on every pull request (so a red check is seen before the merge) and on
# main. Runs only when code changes (not for content-only changes), to keep minutes low. The generated files (engine.js, the
# UI catalogs, the packs, the registry, build/) are never committed: every job builds them.
name: ci
on:
  pull_request:
    paths: ['src/**', 'package*.json', 'tsconfig.json', 'eslint.config.js', '.prettier*', 'manifest.webmanifest', 'icons/**', 'tools/**', 'skill/**', 'engine/**', 'i18n/**', 'tests/**', 'cloud/mcp/**', 'cloud/img/**', 'cloud/supabase.sql', 'index.html', '.github/workflows/ci.yml']
  push:
    branches: [main]
    paths: ['src/**', 'package*.json', 'tsconfig.json', 'eslint.config.js', '.prettier*', 'manifest.webmanifest', 'icons/**', 'tools/**', 'skill/**', 'engine/**', 'i18n/**', 'tests/**', 'cloud/mcp/**', 'cloud/img/**', 'cloud/supabase.sql', 'index.html', '.github/workflows/ci.yml']
  workflow_dispatch: {}
concurrency:   # a newer push to the same pull request cancels the run still going for the older one
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  typescript:
    name: typescript · lint · unit tests · bundles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: typecheck (tsc, strict)
        run: npm run typecheck
      - name: lint (typescript-eslint strict, the dependency rule of the layers, the older JavaScript parsed)
        run: npm run lint
      - name: format (Prettier, src/)
        run: npm run format:check
      - name: unit tests (node --test, src/**/*.test.ts)
        run: npm run test:unit
      - name: bundles (esbuild) within their size budgets
        run: npm run build
  tools:
    name: tools · ${{ matrix.os }} · py${{ matrix.py }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        py: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '${{ matrix.py }}' }
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install pillow pymupdf pypdf pypdfium2
      - name: a fresh build from the clean checkout (the bundles, validate everything, website, one-file app, skill zip, connector)
        run: python tools/build.py site bundle skill
      - name: no generated file is committed (they are built, never stored)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          left="$(git ls-files -ci --exclude-standard)"; [ -z "$left" ] || { echo "::error::generated files are in git (git rm --cached them): $left"; exit 1; }
      - name: validator & licence tests
        run: python tests/validate_visual.py
      - name: skill round trip (unpack the Databricks pack → rebuild → same version)
        shell: python
        run: |
          import json, os, subprocess, sys, tempfile, zipfile
          d = tempfile.mkdtemp(); zipfile.ZipFile('dist/noema-pack-builder.zip').extractall(d)
          S = os.path.join(d, 'noema-pack-builder', 'scripts')
          subprocess.run([sys.executable, os.path.join(S, 'unpack.py'), 'library/subjects/databricks/pack.json', os.path.join(d, 'w')], check=True)
          subprocess.run([sys.executable, os.path.join(S, 'make_pack.py'), os.path.join(d, 'w', 'databricks'), os.path.join(d, 'out')], check=True)
          a = json.load(open('library/subjects/databricks/pack.json', encoding='utf-8')); b = json.load(open(os.path.join(d, 'w', 'databricks', 'build', 'databricks.json'), encoding='utf-8'))
          assert json.loads(zipfile.ZipFile(os.path.join(d, 'out', 'databricks.noema.zip')).read('pack.json'))['version'] == b['version'], 'package differs from the pack'
          assert len(a['chapters']) == len(b['chapters']) and sum(len(c['exercises']) for c in a['chapters']) == sum(len(c['exercises']) for c in b['chapters']), 'round trip changed the pack'
          print('round trip OK on', sys.platform)
      - name: source files travel inside the package (split PDF → parts → .noema.zip → unpack)
        run: python tests/package_sources.py
      - name: picture extraction without poppler (PyMuPDF path)
        shell: python
        run: |
          import sys, os, tempfile; sys.path.insert(0, 'tools')
          from PIL import Image
          d = tempfile.mkdtemp(); pdf = os.path.join(d, 't.pdf'); Image.new('RGB', (900, 600), 'red').save(pdf)
          import extract_images as E; E.have = lambda c: False
          assert E.scan(pdf, os.path.join(d, 'scan')), 'no picture found'
          E.crop(pdf, 1, 10, 10, 50, 50, os.path.join(d, 'c.png'), 120); print('extraction OK on', sys.platform)
          E._has_pymupdf = lambda: False   # the pypdf + pypdfium2 path (what Claude's API sandbox has)
          assert E.scan(pdf, os.path.join(d, 'scan2')), 'no picture found (pypdf)'
          E.crop(pdf, 1, 10, 10, 50, 50, os.path.join(d, 'c2.png'), 120); print('pypdf/pypdfium2 extraction OK on', sys.platform)
  browser:
    name: browser tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install pillow pypdf reportlab python-docx openpyxl python-pptx && npm install --no-save --no-audit --no-fund playwright && npx playwright install --with-deps chromium
      - run: bash tests/run_e2e.sh   # builds the repo first, then every suite (the accessibility check tests/a11y.js among them)
        env: { PW: '${{ github.workspace }}/node_modules/playwright' }
