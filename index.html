<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>noema-lite</title><!-- i18n-ignore: the app's name -->
<meta name="description" content="noema-lite — structured theory, a Socratic AI tutor and gamified practice for any subject."><!-- i18n-ignore: for search engines (English); the loader sets it in the UI language: loader.meta.description -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235f8d5a' stroke-width='2.4' stroke-linecap='round'><circle cx='5' cy='19' r='2'/><circle cx='19' cy='5' r='2'/><path d='M7 19h7a3.5 3.5 0 0 0 0-7h-4a3.5 3.5 0 0 1 0-7h7'/></svg>">
<link rel="manifest" href="manifest.webmanifest"><!-- installable app (PWA): build/pwa.js registers the service worker /sw.js -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#faf7f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1d18" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="fonts/scripts.css"><!-- Arabic, Hebrew, Devanagari, CJK: fetched only when a page shows that script -->
<link rel="stylesheet" href="engine/engine.css">
<link rel="stylesheet" href="engine/tokens.css"><!-- the design tokens (src/ui/tokens): the base set and every character's, after the rules that read them -->
</head>
<body>
<div id="noema-splash"><div class="logo"></div></div>
<!-- 1. configuration (config.local.js is optional, git-ignored and never published) -->
<script src="config.js"></script>
<script src="config.local.js" onerror="this.remove()"></script>
<!-- 2. the TypeScript core (src/composition/app.ts → build/app.js, npm run build): sets window.NoemaCore before the older scripts -->
<script src="build/app.js"></script>
<!-- 3. the catalogue of subjects & profiles (generated by tools/build.py) -->
<script src="library/registry.js"></script>
<!-- 4. libraries, then the UI root (build/ui.js: window.Noema, NoemaThemes, NoemaShell); once the page has loaded it mounts the frame, then loads ONE subject pack and starts engine/engine.js -->
<script src="engine/vendor/marked.umd.js"></script>
<script src="engine/vendor/purify.min.js"></script>
<script src="engine/vendor/intl-messageformat.iife.js"></script>
<script src="engine/i18n/en.js"></script>
<script src="engine/i18n.js"></script>
<!-- the UI root (src/composition/ui.ts → build/ui.js), after the words (engine/i18n.js) -->
<script src="build/ui.js"></script>
<script src="engine/art.js"></script>
<script src="engine/convos.js"></script>
<script src="engine/cloud.js"></script>
<script src="engine/imglib.js"></script>
<script src="engine/claude.js"></script>
<script src="engine/srcfiles.js"></script>
<script src="engine/viewer.js"></script>
<script src="engine/src/43_xapi.js"></script><!-- NoemaXAPI: the shell's "My subjects" ⋮ exports the learning record (xAPI) and the cmi5 package -->
<script src="engine/llm.js"></script>
<script src="engine/mt.js"></script>
<script src="engine/wordlink.js"></script><!-- 文A: the one place that finds a dictionary's words in a page (docs/BRIDGE.md) -->
<script src="engine/bridge.js"></script><!-- 文A language help for students who study in a language that is not their own -->
<script src="engine/packgen.js"></script>
<script src="engine/curriculum.js"></script>
<script src="engine/curjobs.js"></script>
<script src="engine/curshare.js"></script>
<script src="engine/curimport.js"></script>
<script src="engine/sourceplan.js"></script>
<script src="engine/vault.js"></script>
<script src="engine/social.js"></script>
<script src="engine/curmap.js"></script>
<script src="engine/search.js"></script>
<script src="engine/report.js"></script><!-- ⚑ problem reports: screenshot + the exact place, for the app's admins (docs/REPORTS.md) -->
<!-- 5. the areas of the app on the frame (their pages, their parts of Noema and of the start) and the character's reactions -->
<script src="engine/app/library.js"></script>
<script src="engine/app/community.js"></script>
<script src="engine/app/roadmaps.js"></script>
<script src="engine/app/languages.js"></script>
<script src="engine/react.js"></script>
<script src="engine/authoring.js" defer></script>
<script src="build/pwa.js" defer></script><!-- the service worker (offline after the first visit) and "update ready" -->
</body>
</html>
