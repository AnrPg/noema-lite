<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>noema-lite</title>
<meta name="description" content="noema-lite — structured theory, a Socratic AI tutor and gamified practice for any subject.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◆</text></svg>">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="engine/engine.css">
</head>
<body>
<div id="noema-splash"><div class="logo">◆</div></div>
<!-- 1. configuration (config.local.js is optional, git-ignored and never published) -->
<script src="config.js"></script>
<script src="config.local.js" onerror="this.remove()"></script>
<!-- 2. the catalogue of subjects & profiles (generated by tools/build.py) -->
<script src="library/registry.js"></script>
<!-- 3. libraries + loader; the loader mounts the shell, then loads ONE subject pack and starts engine/engine.js -->
<script src="engine/vendor/marked.umd.js"></script>
<script src="engine/vendor/purify.min.js"></script>
<script src="engine/i18n.js"></script>
<script src="engine/i18n_shell.js"></script>
<script src="engine/themes.js"></script>
<script src="engine/art.js"></script>
<script src="engine/convos.js"></script>
<script src="engine/cloud.js"></script>
<script src="engine/imglib.js"></script>
<script src="engine/claude.js"></script>
<script src="engine/srcfiles.js"></script>
<script src="engine/viewer.js"></script>
<script src="engine/packcheck.js"></script>
<script src="engine/llm.js"></script>
<script src="engine/packgen.js"></script>
<script src="engine/curriculum.js"></script>
<script src="engine/curjobs.js"></script>
<script src="engine/curshare.js"></script>
<script src="engine/curimport.js"></script>
<script src="engine/curmap.js"></script>
<!-- 4. the frame every screen lives in (tabs, Today, Roadmaps, Progress, Me) and the character's reactions -->
<script src="engine/shell.js"></script>
<script src="engine/react.js"></script>
<script src="engine/authoring.js" defer></script>
<script src="engine/loader.js"></script>
</body>
</html>
