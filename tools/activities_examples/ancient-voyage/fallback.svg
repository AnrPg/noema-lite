<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" font-family="system-ui, sans-serif" font-size="13"><rect width="600" height="360" fill="#fbfaf6"/><text x="30" y="30" font-size="15" fill="#222">Rome → Alexandria, AD 50: the date of arrival</text><line x1="40" y1="200" x2="560" y2="200" stroke="#888"/><line x1="40" y1="195" x2="40" y2="205" stroke="#888"/><text x="40" y="222" text-anchor="middle" fill="#555">1 March</text><line x1="170" y1="195" x2="170" y2="205" stroke="#888"/><text x="170" y="222" text-anchor="middle" fill="#555">1 April</text><line x1="300" y1="195" x2="300" y2="205" stroke="#888"/><text x="300" y="222" text-anchor="middle" fill="#555">1 May</text><line x1="430" y1="195" x2="430" y2="205" stroke="#888"/><text x="430" y="222" text-anchor="middle" fill="#555">1 June</text><line x1="560" y1="195" x2="560" y2="205" stroke="#888"/><text x="560" y="222" text-anchor="middle" fill="#555">1 July</text><circle cx="124" cy="200" r="6" fill="#4a6fa5"/><text x="124" y="180" text-anchor="middle" fill="#4a6fa5">leave 10 March</text><circle cx="355" cy="200" r="6" fill="#c0483f"/><text x="355" y="160" text-anchor="middle" fill="#c0483f">arrive 25 April (coasts, 45 days)</text><circle cx="292" cy="250" r="6" fill="#4a6fa5"/><text x="292" y="275" text-anchor="middle" fill="#4a6fa5">leave 10 May</text><circle cx="438" cy="250" r="6" fill="#2f8f5b"/><text x="438" y="300" text-anchor="middle" fill="#2f8f5b">arrive 28 May (open sea, 17.6 days)</text><line x1="40" y1="250" x2="560" y2="250" stroke="#ccc" stroke-dasharray="3 3"/></svg>
