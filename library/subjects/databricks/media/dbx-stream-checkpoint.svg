<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs><rect width="800" height="420" fill="#ffffff"/><text x="400.0" y="30.0" font-size="20" font-weight="700" text-anchor="middle" fill="#1f2330" dominant-baseline="central">Inside a streaming checkpoint</text><rect x="30" y="64" width="180" height="50" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><text x="120.0" y="89.0" font-size="18" font-weight="700" text-anchor="middle" fill="#1f2330" dominant-baseline="central">checkpoint/</text><rect x="80" y="140" width="170" height="50" rx="10" fill="#fde6f3" stroke="#d6336c" stroke-width="2"/><text x="165.0" y="165.0" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2330" dominant-baseline="central">offsets/</text><text x="280.0" y="165.0" font-size="16" font-weight="600" text-anchor="start" fill="#1f2330" dominant-baseline="central">what range each micro-batch READS</text><path d="M50.0,165.0 L76.0,165.0" fill="none" stroke="#adb5bd" stroke-width="2"/><rect x="80" y="206" width="170" height="50" rx="10" fill="#fde6f3" stroke="#d6336c" stroke-width="2"/><text x="165.0" y="231.0" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2330" dominant-baseline="central">commits/</text><text x="280.0" y="231.0" font-size="16" font-weight="600" text-anchor="start" fill="#1f2330" dominant-baseline="central">which micro-batches were WRITTEN to the sink</text><path d="M50.0,231.0 L76.0,231.0" fill="none" stroke="#adb5bd" stroke-width="2"/><rect x="80" y="272" width="170" height="50" rx="10" fill="#fde6f3" stroke="#d6336c" stroke-width="2"/><text x="165.0" y="297.0" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2330" dominant-baseline="central">state/</text><text x="280.0" y="297.0" font-size="16" font-weight="600" text-anchor="start" fill="#1f2330" dominant-baseline="central">state-store data of stateful operators</text><path d="M50.0,297.0 L76.0,297.0" fill="none" stroke="#adb5bd" stroke-width="2"/><rect x="80" y="338" width="170" height="50" rx="10" fill="#efebff" stroke="#7c5cff" stroke-width="2"/><text x="165.0" y="363.0" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2330" dominant-baseline="central">metadata</text><text x="280.0" y="363.0" font-size="16" font-weight="600" text-anchor="start" fill="#1f2330" dominant-baseline="central">the query’s identity</text><path d="M50.0,363.0 L76.0,363.0" fill="none" stroke="#adb5bd" stroke-width="2"/><path d="M50.0,116.0 L50.0,363.0" fill="none" stroke="#adb5bd" stroke-width="2"/></svg>