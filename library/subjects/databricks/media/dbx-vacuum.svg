<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs><rect width="800" height="400" fill="#ffffff"/><text x="400.0" y="30.0" font-size="20" font-weight="700" text-anchor="middle" fill="#1f2330" dominant-baseline="central">Why old files pile up (and what VACUUM removes)</text><text x="40.0" y="88.0" font-size="17" font-weight="800" text-anchor="start" fill="#1f2330" dominant-baseline="central">v0</text><text x="90.0" y="88.0" font-size="17" font-weight="600" text-anchor="start" fill="#343a40" dominant-baseline="central">→  {A, B}</text><text x="40.0" y="140.0" font-size="17" font-weight="800" text-anchor="start" fill="#1f2330" dominant-baseline="central">v1</text><text x="90.0" y="140.0" font-size="17" font-weight="600" text-anchor="start" fill="#343a40" dominant-baseline="central">→  {B, C}</text><text x="40.0" y="192.0" font-size="17" font-weight="800" text-anchor="start" fill="#1f2330" dominant-baseline="central">v2</text><text x="90.0" y="192.0" font-size="17" font-weight="600" text-anchor="start" fill="#343a40" dominant-baseline="central">→  {C, D}      ← current snapshot</text><text x="40.0" y="271.0" font-size="15" font-weight="700" text-anchor="start" fill="#5b6172" dominant-baseline="central">physically on storage:</text><path d="M240,236 h86 l14,14 v56 h-100 z" fill="#f1f3f5" stroke="#868e96" stroke-width="1.8"/><path d="M326,236 v14 h14" fill="none" stroke="#868e96" stroke-width="1.5"/><text x="290.0" y="273.0" font-size="22" font-weight="600" text-anchor="middle" fill="#1f2330" dominant-baseline="central">A</text><path d="M370,236 h86 l14,14 v56 h-100 z" fill="#f1f3f5" stroke="#868e96" stroke-width="1.8"/><path d="M456,236 v14 h14" fill="none" stroke="#868e96" stroke-width="1.5"/><text x="420.0" y="273.0" font-size="22" font-weight="600" text-anchor="middle" fill="#1f2330" dominant-baseline="central">B</text><path d="M500,236 h86 l14,14 v56 h-100 z" fill="#e3f7ea" stroke="#2f9e44" stroke-width="1.8"/><path d="M586,236 v14 h14" fill="none" stroke="#2f9e44" stroke-width="1.5"/><text x="550.0" y="273.0" font-size="22" font-weight="600" text-anchor="middle" fill="#1f2330" dominant-baseline="central">C</text><path d="M630,236 h86 l14,14 v56 h-100 z" fill="#e3f7ea" stroke="#2f9e44" stroke-width="1.8"/><path d="M716,236 v14 h14" fill="none" stroke="#2f9e44" stroke-width="1.5"/><text x="680.0" y="273.0" font-size="22" font-weight="600" text-anchor="middle" fill="#1f2330" dominant-baseline="central">D</text><text x="40.0" y="345.0" font-size="14" font-weight="500" text-anchor="start" fill="#5b6172" dominant-baseline="central">Old files stay for time travel until VACUUM deletes them (after the retention period).</text></svg>